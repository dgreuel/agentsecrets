version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agentsecrets-db
    environment:
      POSTGRES_USER: agentsecrets
      POSTGRES_PASSWORD: agentsecrets_password
      POSTGRES_DB: agentsecrets
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentsecrets"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agentsecrets-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentsecrets-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://agentsecrets:agentsecrets_password@postgres:5432/agentsecrets?sslmode=disable"
      JWT_SECRET: "change-this-secret-in-production"
    ports:
      - "8080:8080"
    networks:
      - agentsecrets-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  agentsecrets-network:
    driver: bridge
